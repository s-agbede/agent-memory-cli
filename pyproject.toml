[project]
name = "trip-agent-cli"
version = "0.1.0"
description = "A friendly trip recommendation CLI powered by Redis Agent Memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.99.0",
  "pydantic-settings>=2.10.1",
  "redis-agent-memory==0.2.1",
  "rich>=14.1.0",
  "typer>=0.16.0",
]

[project.scripts]
trip-agent = "trip_agent.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "ruff>=0.12.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trip_agent"]
